{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mobile or Email</title>
    <link rel="stylesheet" href="{% static 'common/css/login.css' %}">
</head>
<body>

    <!-- Login Form -->
    <div class="login-container" id="login-form">
        <h2>Login</h2>
        <form id="login-form-element">
            <label for="email_or_mobile">Email or Mobile:</label>
            <input type="text" id="email_or_mobile" name="email_or_mobile" placeholder="Enter email or mobile number" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="submit">Login</button>
        </form>
        <a href="javascript:void(0);" onclick="showForgotPassword()">Forgot Password?</a>
    </div>

    <!-- Forgot Password Form -->
    <div class="forgot-password-container" id="forgot-password-form" style="display: none;">
        <h2>Forgot Password</h2>
        <form id="forgot-password-form-element">
            <label for="forgot-email_or_mobile">Email or Mobile:</label>
            <input type="text" id="forgot-email_or_mobile" name="email_or_mobile" placeholder="Enter email or mobile number" required>
            <button type="submit">Submit</button>
        </form>
        <a href="javascript:void(0);" onclick="showLogin()">Back to Login</a>
    </div>

    <!-- Reset Password Form -->
    <div class="reset-password-container" id="reset-password-form" style="display: none;">
        <h2>Reset Password</h2>
        <form id="reset-password-form-element">
            <label for="new-password">New Password:</label>
            <input type="password" id="new-password" name="new-password" placeholder="Enter new password" required>
            <button type="submit">Reset Password</button>
        </form>
        <a href="javascript:void(0);" onclick="showLogin()">Back to Login</a>
    </div>

    <script src="{% static 'common/js/login.js' %}"></script>
</body>
{% block javascript %}
<script type="text/javascript" src="/static/js/jquery.js"></script>
<script type="text/javascript">
    $(document).ready(function() {
        $('#err_email').hide()||
        $('#err_contact').hide();
        $('#err_password').hide();
    });

    function login(id) {
        $('#login').submit();
    }

    function form_submit(e) {
        var form_valid = is_form_valid();
        if (form_valid) {
            return true;
        } else {
            e.preventDefault();
            return false;
        }
    }

    function is_form_valid() {
        var flag = true;
        var lemail = $('#email').val();
        var lcontact = $('#contact_number').val();
        var lpassword = $('#password').val();
    
        // Check if either email or contact is valid
        if (lemail == '' || lemail == 'undefined') {
            $('#err_lemail').show();
            flag = false;
        } else {
            $('#err_lemail').hide();
        }
    
        if (lcontact == '' || lcontact == 'undefined') {
            $('#err_lcontact').show();
            flag = false;
        } else {
            $('#err_lcontact').hide();
        }
        if (lpassword == '' || lpassword == 'undefined') {
            $('#err_lpassword').show();
            flag = false;
        } else {
            $('#err_lpassword').hide();
        }
    
        // If both fields are empty, show an error
        if (lemail == '' && lcontact == '') {
            $('#err_lemail').show();
            $('#err_lcontact').show();
            flag = false;
        }
    
        return flag;
    }
</script>
    {% endblock %}    
    </html>
