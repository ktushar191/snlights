<!-- edit_company.html -->
{% load static %}
{% extends 'adminbase.html' %}
{% block stylesheet %}
<style>
    /* Container Box Styling */
 .container {
     width: 100%;
     max-width: 600px; /* Limit the width of the container */
     margin: 0 auto;
     padding: 30px;
     background: rgba(255, 255, 255, 0.9); /* Slightly opaque white background */
     border-radius: 20px; /* Rounded corners */
     box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15); /* Shadow effect */
 }
 
 /* Heading Styling */
 .container h1 {
     text-align: center;
     font-size: 24px;
     font-weight: 700; /* Bold heading */
     color: #1e3a8a; /* Deep blue color */
     margin-bottom: 20px;
 }
 
 /* Form Actions container */
 .form-actions {
     display: flex;
     justify-content: space-between;
     align-items: center;
     padding: 10px;
     margin-top: 20px;
 }
 
 /* Save button - Updated with blue color and hover effect */
 #saveButton {
     background-color: #1e3a8a; /* Deep blue background */
     color: white;
     padding: 10px 20px;
     border: none;
     border-radius: 10px; /* Rounded corners */
     cursor: pointer;
     margin-left: auto;
     transition: background-color 0.3s ease;
 }
 
 #saveButton:hover {
     background-color: #1565c0; /* Darker blue on hover */
 }
 
 /* Edit button - Updated with teal and hover effect */
 #editButton {
     background-color: #ecf0f1; /* Light background */
     color: #1e3a8a; /* Deep blue text */
     padding: 10px 20px;
     border: none;
     border-radius: 10px; /* Rounded corners */
     cursor: pointer;
     margin: 0 auto;
     transition: background-color 0.3s ease;
 }
 
 #editButton:hover {
     background-color: #1abc9c; /* Teal on hover */
 }
 
 /* Delete button - Updated with red and hover effect */
 #deleteButton {
     background-color: red;
     color: white;
     padding: 10px 20px;
     border: none;
     border-radius: 10px; /* Rounded corners */
     cursor: pointer;
     transition: background-color 0.3s ease;
 }
 
 #deleteButton:hover {
     background-color: #d32f2f; /* Darker red on hover */
 }
 
 /* Additional hover effect for buttons */
 button:hover {
     opacity: 0.9;
 }
 
 /* Form Styling */
 .form-group {
     margin-bottom: 15px;
 }
 
 /* Label Styling */
 label {
     display: block;
     font-weight: 600; /* Bold labels */
     margin-bottom: 5px;
     color: #1e3a8a; /* Deep blue color for label */
 }
 
 /* Input and Textarea Styling */
 input, textarea {
     width: 100%;
     padding: 12px 20px;
     font-size: 14px;
     margin-top: 5px;
     border-radius: 10px; /* Rounded corners */
     border: 1px solid rgba(255, 255, 255, 0.4); /* Slight border */
     background: transparent;
     box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.1); /* Light inner shadow */
     color: #1e3a8a; /* Text color */
 }
 
 input[type="text"], textarea {
     font-size: 14px;
 }
 
 input::placeholder {
     color: #80c4e0; /* Light blue placeholder text */
 }
 
 textarea::placeholder {
     color: #80c4e0; /* Light blue placeholder text */
 }
 
 span {
     font-size: 12px;
     display: block;
     margin-top: 5px;
     color: #80c4e0; /* Light blue for hint text */
 }
 
 </style>
 {% endblock %}
{% block content %}
<div class="container">
<h1>Edit Company</h1>

<form method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label for="company_name">Company Name:</label>
        <input type="text" id="company_name" name="company_name" value="{{ company.name }}" required>
    </div>

    <div class="form-group">
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" value="{{ company.address }}" required>
    </div>

    <div class="form-group">
        <label for="contact_number">Contact Number:</label>
        <input type="text" id="contact_number" name="contact_number" value="{{ company.contact_number }}" required>
    </div>

    <div class="form-group">
        <label for="other_info">Other Information:</label>
        <textarea id="other_info" name="other_info">{{ company.other_info }}</textarea>
    </div>

    <button type="submit">Save Changes</button>
</form>
</div>
{% endblock %}
