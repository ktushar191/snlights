{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Company</title>
    <link rel="stylesheet" href="{% static 'css/add_company_styles.css' %}">
    <script type="text/javascript" src="/static/js/jquery.js"></script>
</head>
<body>
    <div class="container">
        <h1 align="center">Add Company</h1>
        <form onsubmit="return form_submit(event);" id="add_company" name="add_company" action="." method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="company_name">Company Name:</label>
                <input type="hidden" name="company_id" value="{{ company.id }}">
                <input type="text" id="company_name" name="company_name" required>
                <span id="err_name" name="err_name" style="color: red;">Enter Company Name</span>
            </div>

            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
            </div>

            <div class="form-group">
                <div id="errorMessages" style="color: red;"></div>
                <label for="contact_number">Contact Number:</label>
                <input type="text" id="contact_number" name="contact_number" required pattern="\d{10}" maxlength="10" placeholder="Enter 10 digit contact number">
                <span id="err_contact" name="err_contact" style="color: red;">Enter Company Contact</span>
            </div>

            <div class="form-group">
                <label for="other_info">Other Information:</label>
                <textarea id="other_info" name="other_info"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" id="saveButton" onclick="addcompany(this);">Save</button>
            </div>
        </form>
    </div>

    <script type="text/javascript">
        $(document).ready(function() {
            $('#err_name').hide();
            $('#err_address').hide();
            $('#err_contact').hide();
        });

        function addcompany(id) {
            $('#add_company').submit();
        }

        function form_submit(e) {
            var form_valid = is_form_valid();
            if (form_valid) {
                return true;
            } else {
                e.preventDefault();
                return false;
            }
        }

        function is_form_valid() {
            var flag = true;
            var cname = $('#company_name').val();
            var ccontact = $('#contact_number').val();
            if (cname == '' || cname == 'undefined') {
                $('#err_name').show();
                flag = false;
            } else {
                $('#err_name').hide();
                flag = true;
            }
            if (ccontact == '' || cname == 'undefined') {
                $('#err_contact').show();
                flag = false;
            } else {
                $('#err_contact').hide();
                flag = true;
            }
            return flag;
        }
    </script>
</body>
</html>
