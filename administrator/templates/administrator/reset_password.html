{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="{% static 'css/create-account.css' %}" />
    <script type="text/javascript" src="/static/js/reset-password.js"></script>

</head>
<body>
    <div class="middle-section">
        <div class="container">
            <h2>Reset Your Password</h2>
            <form onsubmit="return reset_password_form_submit(event);" id="reset_password_form" name="reset_password_form" action="." method="post">
                {% csrf_token %}
            
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" placeholder="Enter your new password" required />
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your new password" required />
                </div>
                <div class="form-group">
                    <button type="submit">Reset Password</button>
                </div>
            </form>
            <div class="form-group links">
                <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>
    
</body>
</html>
