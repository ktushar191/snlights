{% load static %}
<!doctype html>
<html>
    <head>
        <title>Create Account</title>
        <link rel="stylesheet" type="text/css" href="{% static 'css/forgot_style.css' %}">
    </head>
    <body>
        <section>
            <div class="box">
                <div class="form">
                    <h2>Create Account</h2>
                    <form id="signupForm">
                        <div class="inputBx">
                            <input type="text" id="newUsername" placeholder="Username" required>
                        </div>
                        <div class="inputBx">
                            <input type="password" id="newPassword" placeholder="Password" required>
                        </div>
                        <div class="inputBx">
                            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                        </div>
                        <div class="inputBx">
                            <input type="submit" value="Create Account">
                        </div>
                    </form>
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>
            </div>
        </section>

        <script>
            // Handle Account Creation Form Submission
            document.getElementById("signupForm").onsubmit = function(event) {
                event.preventDefault(); // Prevent the form from being submitted automatically

                // Get form values
                var username = document.getElementById("newUsername").value;
                var password = document.getElementById("newPassword").value;
                var confirmPassword = document.getElementById("confirmPassword").value;

                // Validate if passwords match
                if (password !== confirmPassword) {
                    alert("Passwords do not match.");
                    return false;
                }

                // Further validations can be added here for username and password strength
                if (username.length < 3) {
                    alert("Username must be at least 3 characters.");
                    return false;
                }

                if (password.length < 6) {
                    alert("Password must be at least 6 characters.");
                    return false;
                }

                alert("Account created successfully!");
                return true; // Submit the form or proceed with account creation process
            };
        </script>
    </body>
</html>
