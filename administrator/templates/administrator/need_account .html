{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
<link rel="stylesheet" href="{% static 'css/create-account.css' %}" />

<script type="text/javascript" src="{% url '/static/js/create-account.js' %}"></script>

<div class="middle-section">
    <div class="container">
        <h1>Create Account</h1>
        <form onsubmit="return create_account_form_submit(event);" id="create_account_form" name="create_account_form" action="." method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required />
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password" required />
            </div>
            <div class="form-group">
                <button type="submit">Create Account</button>
            </div>
            <div class="form-group links">
                <a href="login.html">Already have an account? Login</a>
            </div>
        </form>
    </div>
</div>


</body>
</html>
